<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="A phone and a desktop paired over an encrypted link, with the session list mirrored on both">
  <rect width="640" height="300" fill="none"/>
  <!-- desktop monitor -->
  <rect x="252" y="58" width="300" height="184" rx="14" fill="#4f7cff" fill-opacity="0.08" stroke="#8a8f98" stroke-width="2"/>
  <rect x="268" y="74" width="76" height="152" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.5"/>
  <g stroke="#8a8f98" stroke-width="1.5" fill="none">
    <rect x="358" y="74" width="178" height="26" rx="6"/>
    <rect x="358" y="110" width="178" height="26" rx="6" fill="#2fbf71" fill-opacity="0.16"/>
    <rect x="358" y="146" width="178" height="26" rx="6"/>
    <rect x="358" y="182" width="178" height="26" rx="6"/>
  </g>
  <circle cx="372" cy="123" r="5" fill="#2fbf71"/>
  <rect x="384" y="119" width="96" height="8" rx="4" fill="#8a8f98" fill-opacity="0.55"/>
  <!-- phone -->
  <rect x="96" y="70" width="120" height="196" rx="18" fill="#8a8f98" fill-opacity="0.12" stroke="#8a8f98" stroke-width="2"/>
  <rect x="112" y="88" width="88" height="20" rx="6" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="112" y="118" width="66" height="16" rx="8" fill="#4f7cff" fill-opacity="0.35"/>
  <rect x="134" y="142" width="66" height="16" rx="8" fill="#8a8f98" fill-opacity="0.35"/>
  <rect x="112" y="166" width="66" height="16" rx="8" fill="#4f7cff" fill-opacity="0.35"/>
  <rect x="112" y="204" width="88" height="18" rx="6" fill="none" stroke="#8a8f98" stroke-width="1.5"/>
  <circle cx="184" cy="213" r="9" fill="#2fbf71"/>
  <!-- encrypted link -->
  <path d="M216 168 C 234 168, 234 152, 252 152" stroke="#2fbf71" stroke-width="2.5" fill="none" stroke-dasharray="7 6"/>
  <rect x="222" y="132" width="22" height="18" rx="4" fill="none" stroke="#2fbf71" stroke-width="2"/>
  <path d="M227 132 v-6 a6 6 0 0 1 12 0 v6" fill="none" stroke="#2fbf71" stroke-width="2"/>
  <!-- stand -->
  <rect x="372" y="242" width="60" height="8" rx="4" fill="#8a8f98" fill-opacity="0.5"/>
  <rect x="352" y="250" width="100" height="6" rx="3" fill="#8a8f98" fill-opacity="0.35"/>
</svg>
